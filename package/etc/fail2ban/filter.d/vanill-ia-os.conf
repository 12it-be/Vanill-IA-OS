# ==============================================================================
# Fail2ban Filter for Vanill-IA OS Authentication Logs
# Log file: /var/log/vanill-ia-auth.log
# Format:   2026-11-20T00:35:12Z VANILL-IA-AUTH FAIL ip=1.2.3.4 user=admin reason=invalid_password
# ==============================================================================

[Definition]
failregex = ^\S+\s+VANILL-IA-AUTH\s+FAIL\s+ip=<HOST>\s+user=\S+\s+reason=\S+$
ignoreregex =
